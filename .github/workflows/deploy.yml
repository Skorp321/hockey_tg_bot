name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch: # Возможность запустить вручную

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run linting
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.venv
        continue-on-error: true

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            
            echo "🔄 Pulling latest changes..."
            git pull origin main

            echo "🗄️  Проверка версии БД (миграция PostgreSQL 13 -> 16, если нужна)..."
            # Каталоги данных мажорных версий PostgreSQL несовместимы, поэтому смены
            # тега образа мало - данные надо перенести дампом до старта приложения.
            # Скрипт идемпотентен: на уже мигрированной базе сразу выходит с кодом 0.
            # SKIP_APP_START=1 - приложение поднимается следующим шагом.
            if ! AUTO_YES=1 SKIP_APP_START=1 bash scripts/upgrade-postgres-16.sh < /dev/null; then
              echo "❌ Миграция БД не удалась. Деплой остановлен, приложение не обновлялось."
              echo "   Данные сохранены: дамп в backups/ и копия volume для отката."
              echo "   Команды отката напечатаны выше в логе миграции."
              exit 1
            fi

            echo "📦 Building and starting containers..."
            docker-compose down
            docker-compose build --no-cache
            docker-compose up -d
            
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            echo "✅ Deployment completed successfully!"
            
            echo "📊 Container status:"
            docker-compose ps
      
      - name: Check deployment status
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            
            echo "🔍 Checking container status..."
            docker-compose ps
            
            echo ""
            echo "🏥 Checking application health..."
            
            # Проверка health endpoint
            HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health)
            
            if [ "$HEALTH_STATUS" = "200" ]; then
              echo "✅ Application is healthy (HTTP $HEALTH_STATUS)"
            else
              echo "❌ Application health check failed (HTTP $HEALTH_STATUS)"
              echo "📋 Recent logs:"
              docker-compose logs --tail=50 bot
              exit 1
            fi
            
            echo ""
            echo "💾 Checking database connection..."
            docker-compose exec -T db pg_isready -U user
            
            if [ $? -eq 0 ]; then
              echo "✅ Database is healthy"
            else
              echo "❌ Database connection failed"
              docker-compose logs --tail=50 db
              exit 1
            fi
            
            echo ""
            echo "✅ All health checks passed!"
      
      - name: Notify on success
        if: success()
        run: |
          echo "✅ Deployment to production completed successfully!"
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment to production failed!"
