name: Manual Deploy & Rollback

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Действие для выполнения'
        required: true
        type: choice
        options:
          - deploy
          - rollback
          - restart
          - logs
      commit_hash:
        description: 'Хэш коммита для rollback (опционально)'
        required: false
        type: string

jobs:
  manual-action:
    name: Execute Manual Action
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        if: inputs.action == 'deploy'
      
      - name: Deploy to Production
        if: inputs.action == 'deploy'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            echo "🔄 Deploying to production..."
            git pull origin main

            echo "🗄️  Проверка версии БД (миграция PostgreSQL 13 -> 16, если нужна)..."
            # Идемпотентно: на уже мигрированной базе сразу выходит с кодом 0.
            if ! AUTO_YES=1 SKIP_APP_START=1 bash scripts/upgrade-postgres-16.sh < /dev/null; then
              echo "❌ Миграция БД не удалась. Деплой остановлен."
              echo "   Данные сохранены: дамп в backups/ и копия volume для отката."
              exit 1
            fi

            docker-compose down
            docker-compose build --no-cache
            docker-compose up -d
            docker image prune -f
            echo "✅ Deploy completed!"
            docker-compose ps
      
      - name: Rollback to Previous Version
        if: inputs.action == 'rollback'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            echo "⏪ Rolling back..."
            
            # Если указан конкретный коммит
            if [ -n "${{ inputs.commit_hash }}" ]; then
              echo "Rolling back to commit: ${{ inputs.commit_hash }}"
              git reset --hard ${{ inputs.commit_hash }}
            else
              # Откатываемся на предыдущий коммит
              echo "Rolling back to previous commit"
              git reset --hard HEAD~1
            fi
            
            git log --oneline -5

            # Данные PostgreSQL несовместимы между мажорными версиями в ОБЕ стороны.
            # Если откат вернул docker-compose.yml на образ старее, чем формат данных,
            # БД не поднимется ("database files are incompatible with server").
            # Понижение требует восстановления из дампа, автоматически это делать нельзя.
            VOLUME="${COMPOSE_PROJECT_NAME:-$(basename "$PWD")}_postgres_data"
            DATA_VER=$(docker run --rm -v "${VOLUME}":/d alpine cat /d/PG_VERSION 2>/dev/null | tr -d '[:space:]' || echo "")
            IMAGE_VER=$(sed -n 's/.*image:[[:space:]]*postgres:\([0-9]\{1,\}\).*/\1/p' docker-compose.yml | head -1)

            if [ -n "$DATA_VER" ] && [ -n "$IMAGE_VER" ] && [ "$DATA_VER" != "$IMAGE_VER" ]; then
              echo "❌ Автоматический откат остановлен: несовместимость PostgreSQL."
              echo "   Формат данных в volume '${VOLUME}': PostgreSQL ${DATA_VER}"
              echo "   docker-compose.yml после отката требует: PostgreSQL ${IMAGE_VER}"
              echo ""
              echo "   Контейнеры НЕ перезапускались, данные не тронуты."
              echo "   Чтобы откатиться на PostgreSQL ${IMAGE_VER}, восстановите данные вручную:"
              echo "     1. ls backups/            # дамп, снятый перед апгрейдом"
              echo "     2. docker volume ls | grep ${VOLUME}_pg   # копия старого volume"
              echo "     3. Верните копию volume или разверните дамп на образе ${IMAGE_VER}"
              exit 1
            fi

            docker-compose down
            docker-compose build --no-cache
            docker-compose up -d
            docker image prune -f
            echo "✅ Rollback completed!"
            docker-compose ps
      
      - name: Restart Containers
        if: inputs.action == 'restart'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            echo "🔄 Restarting containers..."
            docker-compose restart
            echo "✅ Restart completed!"
            docker-compose ps
      
      - name: Show Logs
        if: inputs.action == 'logs'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            echo "📋 Container status:"
            docker-compose ps
            echo ""
            echo "📊 Last 100 log lines:"
            docker-compose logs --tail=100
